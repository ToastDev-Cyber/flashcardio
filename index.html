<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcardio</title>
  <link rel="icon" type="image/png" href="flashcardio-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Roboto:wght@400;700&family=VT323&family=Press+Start+2P&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <!-- Fontawesome (Discord-like icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    body {
      background: #36393f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }

    body.test-active {
      padding: 0;
      background: #1e1f22;
    }

    .flashcardio {
      max-width: 880px;
      width: 100%;
      background: #2f3136;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      padding: 2rem 2rem 2.2rem;
      color: #dcddde;
      transition: all 0.3s ease;
      position: relative;
    }

    body.test-active .flashcardio {
      max-width: 100%;
      border-radius: 0;
      padding: 0;
      background: #1e1f22;
      box-shadow: none;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #40444b;
      padding-bottom: 1rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }

    body.test-active .header {
      display: none;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #5865f2, #8ea1f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 i {
      background: none;
      -webkit-text-fill-color: #5865f2;
      font-size: 2.1rem;
    }

    .header .badge {
      background: #40444b;
      border-radius: 40px;
      padding: 0.2rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #b9bbbe;
    }

    /* input section - hidden during test */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.8rem;
      transition: all 0.3s ease;
    }

    body.test-active .input-section {
      display: none !important;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .input-row label {
      font-weight: 600;
      color: #b9bbbe;
      min-width: 70px;
      font-size: 0.95rem;
    }

    .input-row input, 
    .input-row textarea {
      flex: 1;
      background: #40444b;
      border: none;
      border-radius: 12px;
      padding: 0.7rem 1rem;
      color: #f2f3f5;
      font-size: 0.95rem;
      outline: none;
      transition: 0.15s;
      min-width: 200px;
      resize: vertical;
    }

    .input-row input:focus, 
    .input-row textarea:focus {
      background: #4e535c;
      box-shadow: 0 0 0 2px #5865f2;
    }

    .input-row textarea {
      min-height: 70px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
      justify-content: flex-end;
      align-items: center;
    }

    .timer-container {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #40444b;
      padding: 0.3rem 0.8rem;
      border-radius: 40px;
      border: 1px solid transparent;
    }

    .timer-container input {
      background: #2f3136;
      border: none;
      border-radius: 8px;
      padding: 0.3rem 0.5rem;
      color: #f2f3f5;
      font-size: 0.9rem;
      outline: none;
      width: 60px;
      text-align: center;
    }

    .timer-container input:focus {
      box-shadow: 0 0 0 2px #5865f2;
    }

    .btn {
      background: #40444b;
      border: none;
      border-radius: 40px;
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: #dcddde;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: #5865f2;
      color: white;
    }
    .btn-primary:hover {
      background: #4752c4;
    }
    .btn-success {
      background: #3ba55d;
      color: white;
    }
    .btn-success:hover {
      background: #2d8b4e;
    }
    .btn-secondary {
      background: #4e535c;
      color: white;
    }
    .btn-secondary:hover {
      background: #5d626c;
    }
    .btn-danger {
      background: #ed4245;
      color: white;
    }
    .btn-danger:hover {
      background: #c03537;
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* flashcard area - normal mode */
    .flashcard-area {
      background: #292b2f;
      border-radius: 20px;
      padding: 1.5rem 1.5rem 1rem;
      margin: 1.8rem 0 1.2rem;
      min-height: 140px;
      border-left: 4px solid #5865f2;
      transition: all 0.3s ease;
    }

    /* flashcard area - test mode (full screen) */
    body.test-active .flashcard-area {
      background: transparent;
      border-radius: 0;
      padding: 3rem 4rem;
      margin: 0;
      min-height: 80vh;
      border-left: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .flashcard-prompt {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 0.8rem;
      color: #f2f3f5;
    }

    body.test-active .flashcard-prompt {
      font-size: 2.2rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    body.test-active .flashcard-prompt small {
      font-size: 1.2rem;
      display: block;
      margin-top: 0.5rem;
    }

    .flashcard-prompt small {
      font-weight: 400;
      color: #8e9297;
      font-size: 0.9rem;
      margin-left: 10px;
    }

    .response-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 0.8rem;
    }

    body.test-active .response-buttons {
      gap: 16px;
      margin-top: 2rem;
      justify-content: center;
    }

    .response-btn {
      background: #40444b;
      border: none;
      border-radius: 40px;
      padding: 0.5rem 1.2rem;
      font-weight: 500;
      color: #dcddde;
      transition: 0.1s;
      cursor: pointer;
      flex: 1 0 auto;
      min-width: 100px;
      border: 1px solid transparent;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    body.test-active .response-btn {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      min-width: 140px;
      flex: 0 1 auto;
    }

    .response-btn kbd {
      background: #2f3136;
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      font-size: 0.75rem;
      color: #b9bbbe;
      margin-left: 6px;
      border: 1px solid #40444b;
    }

    body.test-active .response-btn kbd {
      font-size: 0.85rem;
      margin-left: 8px;
    }

    .response-btn:hover {
      background: #4e535c;
      border-color: #5865f2;
    }
    .response-btn.selected {
      background: #5865f2;
      color: white;
      border-color: #5865f2;
    }
    .response-btn.selected kbd {
      background: #4752c4;
      color: white;
      border-color: #5865f2;
    }

    .progress-indicator {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #8e9297;
      margin-top: 0.8rem;
    }

    body.test-active .progress-indicator {
      font-size: 1.1rem;
      margin-top: 2rem;
      padding: 0 1rem;
      justify-content: center;
      gap: 3rem;
    }

    .result-panel {
      background: #1e1f22;
      border-radius: 20px;
      padding: 1.4rem 1.8rem;
      margin-top: 1.8rem;
      border-left: 4px solid #3ba55d;
      display: none;
    }

    .result-panel.active {
      display: block;
    }

    body.test-active .result-panel {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      border-radius: 24px;
      padding: 2.5rem;
    }

    .result-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f2f3f5;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.8rem;
    }

    body.test-active .result-title {
      font-size: 2rem;
      justify-content: center;
    }

    .focus-list {
      list-style: none;
      margin-top: 0.6rem;
    }

    .focus-list li {
      background: #2f3136;
      margin: 6px 0;
      padding: 0.6rem 1rem;
      border-radius: 14px;
      border-left: 3px solid #ed4245;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    body.test-active .focus-list li {
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
    }

    .focus-list .tag {
      background: #ed4245;
      color: white;
      border-radius: 40px;
      padding: 0.1rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .reset-area {
      margin-top: 1.2rem;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    body.test-active .reset-area {
      justify-content: center;
      margin-top: 2rem;
    }

    body.test-active .reset-area .btn {
      padding: 0.8rem 2rem;
      font-size: 1rem;
    }

    .status-message {
      color: #b9bbbe;
      font-size: 0.9rem;
      margin-top: 0.8rem;
      font-style: italic;
    }

    body.test-active .status-message {
      font-size: 1.1rem;
      text-align: center;
    }

    .footer {
      margin-top: 1.4rem;
      font-size: 0.8rem;
      color: #72767d;
      display: flex;
      gap: 20px;
      border-top: 1px solid #40444b;
      padding-top: 1rem;
    }

    body.test-active .footer {
      display: none;
    }

    .exit-test-btn {
      margin-left: auto;
    }

    .theme-selector {
      background: #40444b;
      color: #dcddde;
      border: none;
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      outline: none;
    }

    /* ===== SLIDER STYLES ===== */
    .slider-container {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
    }

    .slider-container input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 12px;
      border-radius: 10px;
      background: linear-gradient(to right, #ed4245, #faa81a, #3ba55d);
      outline: none;
      transition: opacity 0.2s;
    }

    .slider-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 3px solid #5865f2;
      transition: 0.1s;
    }

    .slider-container input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
      border-color: #8ea1f0;
    }

    .slider-container input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      border: 3px solid #5865f2;
    }

    .slider-value {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .slider-value .current-value {
      font-size: 2rem;
      padding: 8px 20px;
      border-radius: 12px;
      background: #40444b;
      min-width: 80px;
      text-align: center;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #8e9297;
      margin-top: 5px;
    }

    .slider-submit {
      margin-top: 15px;
      padding: 12px 40px;
      font-size: 1.1rem;
      border-radius: 40px;
      background: #3ba55d;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-weight: 600;
    }

    .slider-submit:hover {
      background: #2d8b4e;
      transform: scale(1.02);
    }

    body.test-active .slider-container input[type="range"] {
      height: 16px;
    }

    body.test-active .slider-container input[type="range"]::-webkit-slider-thumb {
      width: 36px;
      height: 36px;
    }

    body.test-active .slider-value .current-value {
      font-size: 2.5rem;
      padding: 12px 30px;
    }

    /* ===== KAHOOT THEME ===== */
    body.theme-kahoot {
      background: #46178f !important;
      color: #ffffff !important;
    }

    body.theme-kahoot .flashcardio {
      background: rgba(32, 12, 70, 0.92) !important;
      color: #ffffff !important;
      border: 3px solid #6a3b9a !important;
      box-shadow: 0 0 60px rgba(70, 23, 143, 0.5), inset 0 0 30px rgba(106, 59, 154, 0.2) !important;
    }

    body.theme-kahoot .header {
      border-bottom-color: #6a3b9a !important;
    }

    body.theme-kahoot .header h1 {
      background: linear-gradient(135deg, #ffcd00, #ff6b00) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
    }

    body.theme-kahoot .header h1 i {
      -webkit-text-fill-color: #ffcd00 !important;
      color: #ffcd00 !important;
    }

    body.theme-kahoot .flashcard-area {
      background: rgba(255, 255, 255, 0.05) !important;
      border-left: 4px solid #ffcd00 !important;
    }

    body.theme-kahoot .input-row input,
    body.theme-kahoot .input-row textarea,
    body.theme-kahoot .timer-container,
    body.theme-kahoot .timer-container input,
    body.theme-kahoot .theme-selector,
    body.theme-kahoot .badge {
      background: rgba(255, 255, 255, 0.1) !important;
      color: #ffffff !important;
      border: 2px solid #6a3b9a !important;
    }

    body.theme-kahoot .btn {
      background: #6a3b9a !important;
      color: white !important;
      border: 2px solid #8a5bbd !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
    }

    body.theme-kahoot .btn-primary {
      background: #ffcd00 !important;
      color: #46178f !important;
      border-color: #ffcd00 !important;
    }

    body.theme-kahoot .btn-primary:hover {
      background: #ffdb4d !important;
      transform: scale(1.05);
    }

    body.theme-kahoot .btn-success {
      background: #27ae60 !important;
      border-color: #2ecc71 !important;
    }

    body.theme-kahoot .btn-success:hover {
      background: #2ecc71 !important;
      transform: scale(1.05);
    }

    body.theme-kahoot .btn-danger {
      background: #e74c3c !important;
      border-color: #ff6b6b !important;
    }

    body.theme-kahoot .btn-danger:hover {
      background: #ff6b6b !important;
      transform: scale(1.05);
    }

    body.theme-kahoot .btn-secondary:hover {
      transform: scale(1.05);
    }

    body.theme-kahoot .response-btn {
      background: rgba(255, 255, 255, 0.1) !important;
      color: white !important;
      border: 3px solid #6a3b9a !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      transition: 0.15s !important;
    }

    body.theme-kahoot .response-btn:hover {
      background: rgba(255, 255, 255, 0.2) !important;
      border-color: #8a5bbd !important;
      transform: scale(1.05);
    }

    body.theme-kahoot .response-btn.selected {
      background: #ffcd00 !important;
      color: #46178f !important;
      border-color: #ffcd00 !important;
      transform: scale(1.08);
    }

    body.theme-kahoot .response-btn.selected kbd {
      background: #46178f !important;
      color: #ffcd00 !important;
      border-color: #46178f !important;
    }

    body.theme-kahoot .progress-indicator {
      color: #b08fd4 !important;
    }

    body.theme-kahoot .result-panel {
      background: rgba(255, 255, 255, 0.08) !important;
      border-left: 4px solid #ffcd00 !important;
    }

    body.theme-kahoot .focus-list li {
      background: rgba(255, 255, 255, 0.08) !important;
      border-left: 3px solid #ff6b6b !important;
    }

    body.theme-kahoot .focus-list .tag {
      background: #ff6b6b !important;
    }

    body.theme-kahoot .footer {
      border-top-color: #6a3b9a !important;
      color: #8a5bbd !important;
    }

    body.theme-kahoot .flashcard-prompt,
    body.theme-kahoot .input-row label,
    body.theme-kahoot .status-message {
      color: #ffffff !important;
    }

    body.theme-kahoot .status-badge {
      background: rgba(255, 255, 255, 0.1) !important;
      color: #ffcd00 !important;
    }

    body.theme-kahoot .slider-container input[type="range"] {
      background: linear-gradient(to right, #ff6b6b, #ffcd00, #2ecc71) !important;
    }

    body.theme-kahoot .slider-container input[type="range"]::-webkit-slider-thumb {
      background: #ffcd00 !important;
      border-color: #46178f !important;
      box-shadow: 0 0 20px rgba(255, 205, 0, 0.5) !important;
    }

    body.theme-kahoot .slider-value .current-value {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 2px solid #ffcd00 !important;
      color: #ffcd00 !important;
    }

    body.theme-kahoot .slider-submit {
      background: #ffcd00 !important;
      color: #46178f !important;
    }

    body.theme-kahoot .slider-submit:hover {
      background: #ffdb4d !important;
      transform: scale(1.05);
    }

    body.theme-kahoot .slider-labels {
      color: #b08fd4 !important;
    }

    /* Kahoot animations */
    @keyframes kahootPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    body.theme-kahoot .flashcardio {
      animation: kahootPulse 3s ease-in-out infinite;
    }

    @keyframes kahootGlow {
      0% { box-shadow: 0 0 60px rgba(70, 23, 143, 0.5); }
      50% { box-shadow: 0 0 80px rgba(255, 205, 0, 0.3); }
      100% { box-shadow: 0 0 60px rgba(70, 23, 143, 0.5); }
    }

    body.theme-kahoot .flashcardio {
      animation: kahootPulse 3s ease-in-out infinite, kahootGlow 4s ease-in-out infinite;
    }

    /* ===== Regular flashcard flip animation ===== */
    .flashcard-container {
      perspective: 1000px;
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      max-width: 600px;
      min-height: 120px;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      min-height: 120px;
      backface-visibility: hidden;
      border-radius: 16px;
      padding: 1.5rem;
      background: #40444b;
      border: 2px solid #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.2rem;
      flex-direction: column;
      gap: 10px;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: #4752c4;
    }

    .flashcard-front .hint, .flashcard-back .hint {
      font-size: 0.85rem;
      color: #8e9297;
      margin-top: 8px;
    }

    body.test-active .flashcard-front, 
    body.test-active .flashcard-back {
      min-height: 200px;
      font-size: 1.8rem;
      padding: 2.5rem;
    }

    /* Theme Fonts */
    body.theme-discord *:not([class*="fa-"]), body.theme-discord {font-family:"Segoe UI","Helvetica Neue",sans-serif!important;}
    body.theme-oldweb *:not([class*="fa-"]), body.theme-oldweb {font-family:Tahoma,Verdana,Arial,sans-serif!important;}
    body.theme-twitter *:not([class*="fa-"]), body.theme-twitter {font-family:Roboto,Helvetica,Arial,sans-serif!important;}
    body.theme-roblox *:not([class*="fa-"]), body.theme-roblox {font-family:Nunito,sans-serif!important;}
    body.theme-yellow *:not([class*="fa-"]), body.theme-yellow {font-family:Caveat,cursive!important;}
    body.theme-neongreen *:not([class*="fa-"]), body.theme-neongreen {font-family:VT323,monospace!important;letter-spacing:1px;}
    body.theme-neongreen .header h1 *:not([class*="fa-"]), body.theme-neongreen .header h1{font-family:"Press Start 2P",monospace!important;font-size:1.3rem;}
    body.theme-kahoot *:not([class*="fa-"]), body.theme-kahoot {font-family:"Nunito","Segoe UI",sans-serif!important;}
  </style>
</head>
<body>
<div class="flashcardio" id="app">
  <!-- header -->
  <div class="header">
    <h1><i class="fas fa-brain"></i> Flashcardio</h1>
    <span class="badge"><i class="fas fa-tasks"></i> active</span>
    <span style="margin-left: auto; color: inherit; font-size: 0.9rem;"><i class="fas fa-comments"></i>probably a vibe</span>
    <select id="themeSelector" class="theme-selector">
      <option value="discord">Discord Black</option>
      <option value="oldweb">Average 2009 Website</option>
      <option value="twitter">Twitter Black</option>
      <option value="roblox">Roblox Light Mode</option>
      <option value="yellow">YELOOW</option>
      <option value="neongreen">Neon Dark Green</option>
      <option value="minecraft">Minecraft Inventory</option>
      <option value="longhorn">Windows Longhorn</option>
      <option value="kahoot">🎮 Kahoot</option>
    </select>
  </div>

  <!-- input section -->
  <div class="input-section" id="inputSection">
    <div class="input-row">
      <label><i class="fas fa-book"></i> Subject</label>
      <input type="text" id="subjectInput" placeholder="e.g. History, Python, Anatomy" value="Biology 101">
    </div>
    <div class="input-row">
      <label><i class="fas fa-list-ul"></i> Notes</label>
      <textarea id="notesInput" placeholder="One item per line&#10;e.g.&#10;Mitochondria is powerhouse || true&#10;Earth is flat || false&#10;front|back&#10;TYPE:slider|min:0|max:100|num:67">Mitochondria is powerhouse || true
Earth is flat || false
DNA double helix
TYPE:blank|What is the powerhouse of the cell?|mitochondria
Cell membrane function || true
The sky is green || false
What is the capital of France?|Paris
Who wrote Romeo and Juliet?|William Shakespeare
What is 2+2?|4
TYPE:slider|min:0|max:100|num:67|What is the probability?
TYPE:slider|min:-50|max:50|num:-12|What is the temperature?</textarea>
    </div>
    <div class="button-group">
      <div class="timer-container">
        <i class="fas fa-hourglass-half" style="font-size: 0.85rem;"></i>
        <input type="number" id="timerLength" min="1" max="600" value="30">
        <span style="font-size:0.85rem; padding-right:4px;">s</span>
      </div>
      <button class="btn btn-primary" id="loadBtn"><i class="fas fa-upload"></i> Load cards</button>
      <button class="btn btn-success" id="testBtn"><i class="fas fa-pen-fancy"></i> Test</button>
      <button class="btn btn-secondary" id="shuffleBtn"><i class="fas fa-random"></i> Shuffle</button>
      <button class="btn btn-secondary" id="timerBtn"><i class="fas fa-clock"></i> Timer: OFF</button>
      <button class="btn btn-secondary" id="timerModeBtn"><i class="fas fa-sync-alt"></i> Mode: Per-Card</button>
      <button class="btn btn-secondary" id="negativeTimerBtn"><i class="fas fa-history"></i> Neg. Timer: OFF</button>
      <button class="btn btn-secondary" id="exportBtn">
  <i class="fas fa-download"></i> Export Notes
</button>

<button class="btn btn-secondary" id="importBtn">
  <i class="fas fa-upload"></i> Import Notes
</button>

<input type="file" id="importFile" accept=".txt" style="display:none;">
    </div>
  </div>

  <!-- flashcard area -->
  <div class="flashcard-area" id="flashcardArea">
    <div class="flashcard-prompt">
      <i class="fas fa-quote-left" style="margin-right: 6px;"></i>
      <span id="questionText">Add your subject & notes, then click "Test"</span>
      <small id="cardCounter"></small>
    </div>
    <div id="responseButtons" class="response-buttons"></div>
    <div class="progress-indicator">
      <span id="progressText"><i class="fas fa-chevron-circle-right"></i> 0 / 0</span>
      <span id="statusBadge" style="padding:0.2rem 1rem; border-radius:40px;">ready</span>
    </div>
  </div>

  <!-- result panel -->
  <div class="result-panel" id="resultPanel">
    <div class="result-title"><i class="fas fa-bullseye" style="color:#ed4245;"></i> Focus on these</div>
    <div id="focusContainer">
      <ul class="focus-list" id="focusList"></ul>
    </div>
    <div class="reset-area">
      <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset session</button>
      <button class="btn btn-secondary" id="newCardsBtn"><i class="fas fa-plus-circle"></i> New cards</button>
      <button class="btn btn-danger exit-test-btn" id="exitTestBtn"><i class="fas fa-times"></i> Exit test</button>
    </div>
    <div id="extraMessage" class="status-message"></div>
  </div>

  <div class="footer">
    <span><i class="fas fa-check-circle" style="color:#3ba55d;"></i> honest answers</span>
    <span><i class="fas fa-robot"></i> smart focus</span>
  </div>
</div>

<script>
  (function(){
    let flashcards = [];
    let currentIndex = 0;
    let scores = [];
    let timerSpent = []; 
    let tested = false;
    let subject = 'Biology 101';
    let isRegularFlashcard = false;

    let timerEnabled = false;
    let persistentTimerMode = false;
    let negativeTimerEnabled = false;
    let timerInterval = null;
    let currentRemaining = 30;

    const subjectInput = document.getElementById('subjectInput');
    const notesInput = document.getElementById('notesInput');
    const loadBtn = document.getElementById('loadBtn');
    const testBtn = document.getElementById('testBtn');
    const timerLength = document.getElementById('timerLength');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const timerBtn = document.getElementById('timerBtn');
    const timerModeBtn = document.getElementById('timerModeBtn');
    const negativeTimerBtn = document.getElementById('negativeTimerBtn');
    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");
    const questionText = document.getElementById('questionText');
    const cardCounter = document.getElementById('cardCounter');
    const progressText = document.getElementById('progressText');
    const statusBadge = document.getElementById('statusBadge');
    const responseButtonsContainer = document.getElementById('responseButtons');
    const resultPanel = document.getElementById('resultPanel');
    const focusList = document.getElementById('focusList');
    const extraMessage = document.getElementById('extraMessage');
    const resetBtn = document.getElementById('resetBtn');
    const newCardsBtn = document.getElementById('newCardsBtn');
    const exitTestBtn = document.getElementById('exitTestBtn');
    const app = document.getElementById('app');
    const body = document.body;
    const themeSelector = document.getElementById("themeSelector");

    // Function to calculate score based on slider accuracy
    function calculateSliderScore(selected, correct) {
      const diff = Math.abs(selected - correct);
      const maxDiff = Math.max(Math.abs(correct), 100);
      const accuracy = Math.max(0, 1 - (diff / maxDiff));
      if (accuracy >= 0.9) return 3;
      if (accuracy >= 0.7) return 2;
      if (accuracy >= 0.5) return 1;
      return 0;
    }

    function enterTestMode() {
      body.classList.add('test-active');
      void body.offsetWidth;
    }

    function exitTestMode() {
      clearInterval(timerInterval);
      body.classList.remove('test-active');
      tested = false;
      scores = flashcards.map(card => card.defaultScore !== undefined ? card.defaultScore : -1);
      timerSpent = new Array(flashcards.length).fill(0);
      currentIndex = 0;
      isRegularFlashcard = false;
      resultPanel.classList.remove('active');
      responseButtonsContainer.innerHTML = '';
      if (flashcards.length > 0) {
        questionText.textContent = 'Press "Test" to start.';
        cardCounter.textContent = `${flashcards.length} cards ready`;
        progressText.textContent = `⏳ ${flashcards.length} cards`;
        statusBadge.textContent = '📋 loaded';
      } else {
        questionText.textContent = 'Add notes and load cards.';
        cardCounter.textContent = '';
        progressText.textContent = '📭 0';
        statusBadge.textContent = '⏸ idle';
      }
      extraMessage.textContent = '';
    }

    function renderCard() {
      if (!tested || flashcards.length === 0) {
        if (!persistentTimerMode) clearInterval(timerInterval);
        if (flashcards.length === 0) {
          questionText.textContent = 'No flashcards. Load some notes!';
          cardCounter.textContent = '';
          progressText.textContent = '📭 0 / 0';
          statusBadge.textContent = '⏸ idle';
        } else {
          questionText.textContent = 'Press "Test" to start.';
          cardCounter.textContent = `${flashcards.length} cards ready`;
          progressText.textContent = `⏳ ${flashcards.length} cards`;
          statusBadge.textContent = '📋 loaded';
        }
        responseButtonsContainer.innerHTML = '';
        return;
      }

      const card = flashcards[currentIndex];
      startTimer();
      
      cardCounter.textContent = `${currentIndex+1} / ${flashcards.length}`;
      progressText.textContent = `🧠 ${scores.filter(s => s !== -1).length} / ${flashcards.length} answered`;
      if (!timerEnabled) {
        statusBadge.textContent = `📌 ${subject}`;
      }

      const currentScore = scores[currentIndex];

      // Check for slider type
      if (card.isSlider) {
        isRegularFlashcard = false;
        questionText.textContent = card.question || 'Untitled';
        
        // Get min, max, and correct value
        const min = card.sliderMin !== undefined ? card.sliderMin : 0;
        const max = card.sliderMax !== undefined ? card.sliderMax : 100;
        const correct = card.sliderCorrect !== undefined ? card.sliderCorrect : 50;
        const range = max - min;
        
        // Create slider UI
        responseButtonsContainer.innerHTML = `
          <div class="slider-container">
            <div class="slider-labels">
              <span>${min}</span>
              <span>${max}</span>
            </div>
            <input type="range" id="sliderInput" min="${min}" max="${max}" value="${Math.round((min + max) / 2)}" step="1">
            <div class="slider-value">
              <span>Value:</span>
              <span class="current-value" id="sliderValue">${Math.round((min + max) / 2)}</span>
            </div>
            <button class="slider-submit" id="sliderSubmit">
              <i class="fas fa-check"></i> Submit
            </button>
          </div>
        `;

        // Add event listeners
        const sliderInput = document.getElementById('sliderInput');
        const sliderValue = document.getElementById('sliderValue');
        const sliderSubmit = document.getElementById('sliderSubmit');

        sliderInput.addEventListener('input', function() {
          sliderValue.textContent = this.value;
        });

        sliderSubmit.addEventListener('click', function() {
          const selectedValue = parseInt(sliderInput.value);
          const scoreVal = calculateSliderScore(selectedValue, correct);
          handleResponse(scoreVal);
        });

        // Keyboard support: Enter to submit
        sliderInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            const selectedValue = parseInt(this.value);
            const scoreVal = calculateSliderScore(selectedValue, correct);
            handleResponse(scoreVal);
          }
        });

      } else if (card.isRegular) {
        isRegularFlashcard = true;
        questionText.innerHTML = `
          <div class="flashcard-container">
            <div class="flashcard-inner" id="flashcardInner">
              <div class="flashcard-front">
                <i class="fas fa-eye" style="opacity:0.5; margin-bottom:8px;"></i>
                ${card.question}
                <div class="hint">👆 Click to flip</div>
              </div>
              <div class="flashcard-back">
                <i class="fas fa-lightbulb" style="opacity:0.5; margin-bottom:8px;"></i>
                ${card.backContent}
                <div class="hint">👆 Click to flip back</div>
              </div>
            </div>
          </div>
        `;

        const flashcardInner = document.getElementById('flashcardInner');
        if (flashcardInner) {
          flashcardInner.addEventListener('click', function(e) {
            this.classList.toggle('flipped');
          });
        }

        responseButtonsContainer.innerHTML = `
          <button class="response-btn ${currentScore === 0 ? 'selected' : ''}" data-score="0"><i class="fas fa-skull"></i> Forgor <kbd>1</kbd></button>
          <button class="response-btn ${currentScore === 1 ? 'selected' : ''}" data-score="1"><i class="fas fa-question-circle"></i> Partially recall <kbd>2</kbd></button>
          <button class="response-btn ${currentScore === 2 ? 'selected' : ''}" data-score="2"><i class="fas fa-check-circle"></i> Recall <kbd>3</kbd></button>
          <button class="response-btn ${currentScore === 3 ? 'selected' : ''}" data-score="3"><i class="fas fa-star"></i> Easily recall <kbd>4</kbd></button>
        `;

        responseButtonsContainer.querySelectorAll('.response-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const val = parseInt(e.currentTarget.dataset.score, 10);
            handleResponse(val);
          });
        });
      } else if (card.isBlank) {
        isRegularFlashcard = false;
        questionText.textContent = card.question || 'Untitled';
        responseButtonsContainer.innerHTML = `
          <input 
            id="blankAnswerInput"
            class="response-btn"
            placeholder="Type your answer..."
            style="flex:1; padding:1rem;"
            autocomplete="off"
          >
          <button class="response-btn" id="blankSubmitBtn">
            <i class="fas fa-check"></i> Submit
          </button>
        `;

        document.getElementById("blankSubmitBtn").onclick = () => {
          const input = document.getElementById("blankAnswerInput");
          const userAnswer = input.value.trim().toLowerCase();
          const correctAnswer = card.answer.trim().toLowerCase();
          handleResponse(userAnswer === correctAnswer ? 3 : 0);
        };
      } else if (card.isTrueFalse) {
        isRegularFlashcard = false;
        questionText.textContent = card.question || 'Untitled';
        responseButtonsContainer.innerHTML = `
          <button class="response-btn ${currentScore === 3 ? 'selected' : ''}" data-val="true"><i class="fas fa-check" style="color:#3ba55d;"></i> True <kbd>1</kbd></button>
          <button class="response-btn ${currentScore === 0 ? 'selected' : ''}" data-val="false"><i class="fas fa-times" style="color:#ed4245;"></i> False <kbd>2</kbd></button>
        `;
      } else {
        isRegularFlashcard = false;
        questionText.textContent = card.question || 'Untitled';
        responseButtonsContainer.innerHTML = `
          <button class="response-btn ${currentScore === 0 ? 'selected' : ''}" data-score="0"><i class="fas fa-skull"></i> Forgor <kbd>1</kbd></button>
          <button class="response-btn ${currentScore === 1 ? 'selected' : ''}" data-score="1"><i class="fas fa-question-circle"></i> Partially recall <kbd>2</kbd></button>
          <button class="response-btn ${currentScore === 2 ? 'selected' : ''}" data-score="2"><i class="fas fa-check-circle"></i> Recall <kbd>3</kbd></button>
          <button class="response-btn ${currentScore === 3 ? 'selected' : ''}" data-score="3"><i class="fas fa-star"></i> Easily recall <kbd>4</kbd></button>
        `;
      }

      // Add event listeners for non-regular, non-blank, non-slider cards
      if (!card.isRegular && !card.isBlank && !card.isSlider) {
        responseButtonsContainer.querySelectorAll('.response-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const targetBtn = e.currentTarget;
            if (card.isTrueFalse) {
              const userChoice = targetBtn.dataset.val === 'true';
              const scoreVal = userChoice === card.expectedBool ? 3 : 0;
              handleResponse(scoreVal);
            } else {
              const val = parseInt(targetBtn.dataset.score, 10);
              handleResponse(val);
            }
          });
        });
      }

      if (scores.every(s => s !== -1)) {
        showResults();
      }
    }

    function computeFocus() {
      const focusItems = [];
      for (let i = 0; i < flashcards.length; i++) {
        const score = scores[i];
        const card = flashcards[i];
        if (score === 0 || score === 1) {
          const overflow = timerSpent[i];
          let timeLabel = '';
          if (overflow < 0) {
            timeLabel = ` (${overflow}s overtime)`;
          } else if (overflow > 0 && timerEnabled) {
            timeLabel = ` (${overflow}s left)`;
          }
          
          let labelText = 'Forgor';
          if (card.isBlank || card.isTrueFalse) {
            labelText = 'Incorrect';
          } else if (card.isSlider) {
            labelText = 'Off target';
          } else if (score === 1) {
            labelText = 'Partially recall';
          }

          focusItems.push({
            question: (card.question || 'Untitled') + timeLabel,
            score: score,
            label: labelText
          });
        }
      }
      return focusItems;
    }

    function showResults() {
      clearInterval(timerInterval);
      const focusItems = computeFocus();
      resultPanel.classList.add('active');
      focusList.innerHTML = '';
      if (focusItems.length === 0) {
        focusList.innerHTML = `<li style="border-left-color: #3ba55d; background: rgba(0,0,0,0.05);"><i class="fas fa-check-circle" style="color:#3ba55d;"></i> All cards mastered! Keep it up 🎉</li>`;
        extraMessage.textContent = '✨ You answered everything correctly. Great job!';
      } else {
        focusItems.forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `<span><i class="fas fa-${item.score === 0 ? 'skull' : 'question-circle'}" style="margin-right:10px; color:${item.score === 0 ? '#ed4245' : '#faa81a'};"></i> ${item.question}</span>
                          <span class="tag">${item.label}</span>`;
          focusList.appendChild(li);
        });
        extraMessage.textContent = `🔁 ${focusItems.length} card(s) need extra review. Focus on these.`;
      }
      responseButtonsContainer.innerHTML = '';
      statusBadge.textContent = '✅ done';
    }

    function loadCards() {
      clearInterval(timerInterval);
      const rawSubject = subjectInput.value.trim() || 'Subject';
      subject = rawSubject;
      const rawNotes = notesInput.value;
      const lines = rawNotes.split('\n').map(line => line.trim()).filter(line => line.length > 0);
      
      if (lines.length === 0) {
        flashcards = [];
        questionText.textContent = '⚠️ No notes found. Add items line by line.';
        cardCounter.textContent = '';
        progressText.textContent = '📭 0';
        statusBadge.textContent = '⚠️ empty';
        responseButtonsContainer.innerHTML = '';
        resultPanel.classList.remove('active');
        tested = false;
        scores = [];
        timerSpent = [];
        exitTestMode();
        return;
      }

      flashcards = lines.map(line => {
        let questionText = line;
        let defaultScore = undefined;
        let isTrueFalse = false;
        let expectedBool = false;
        let isBlank = false;
        let answer = "";
        let isRegular = false;
        let backContent = "";
        let isSlider = false;
        let sliderMin = 0;
        let sliderMax = 100;
        let sliderCorrect = 50;

        // Check for slider type
        if (line.startsWith("TYPE:slider|")) {
          const parts = line.split("|");
          isSlider = true;
          
          // Parse min, max, num, and question
          let question = "";
          let min = 0;
          let max = 100;
          let correct = 50;
          
          for (let i = 1; i < parts.length; i++) {
            const part = parts[i];
            if (part.startsWith("min:")) {
              min = parseFloat(part.substring(4));
            } else if (part.startsWith("max:")) {
              max = parseFloat(part.substring(4));
            } else if (part.startsWith("num:")) {
              correct = parseFloat(part.substring(4));
            } else if (part.startsWith("neg:")) {
              // Support negative values in min/max
              const negValue = parseFloat(part.substring(4));
              if (min === 0 && max === 100) {
                min = -negValue;
                max = negValue;
              }
            } else {
              question = part;
            }
          }
          
          questionText = question || line;
          sliderMin = min;
          sliderMax = max;
          sliderCorrect = correct;
        } else if (line.includes('|') && !line.startsWith("TYPE:") && !line.includes('|| true') && !line.includes('|| false')) {
          const parts = line.split('|');
          if (parts.length >= 2) {
            questionText = parts[0].trim();
            backContent = parts.slice(1).join('|').trim();
            isRegular = true;
          }
        } else if (line.startsWith("TYPE:blank|")) {
          const parts = line.split("|");
          questionText = parts[1];
          answer = parts[2].trim().toLowerCase();
          isBlank = true;
        } else if (line.endsWith('|| true')) {
          questionText = line.slice(0, line.lastIndexOf('|| true')).trim();
          isTrueFalse = true;
          expectedBool = true;
        } else if (line.endsWith('|| false')) {
          questionText = line.slice(0, line.lastIndexOf('|| false')).trim();
          isTrueFalse = true;
          expectedBool = false;
        }

        return { 
          question: questionText, 
          defaultScore: defaultScore, 
          isTrueFalse: isTrueFalse, 
          expectedBool: expectedBool,
          isBlank: isBlank,
          answer: answer,
          isRegular: isRegular,
          backContent: backContent,
          isSlider: isSlider,
          sliderMin: sliderMin,
          sliderMax: sliderMax,
          sliderCorrect: sliderCorrect
        };
      });

      tested = false;
      scores = flashcards.map(card => card.defaultScore !== undefined ? card.defaultScore : -1);
      timerSpent = new Array(flashcards.length).fill(0);
      currentIndex = 0;
      isRegularFlashcard = false;
      resultPanel.classList.remove('active');
      responseButtonsContainer.innerHTML = '';
      questionText.textContent = 'Press "Test" to start.';
      cardCounter.textContent = `${flashcards.length} cards ready`;
      progressText.textContent = `⏳ ${flashcards.length} cards`;
      statusBadge.textContent = '📋 loaded';
      extraMessage.textContent = '';
      exitTestMode();
    }

    function startTest() {
      if (flashcards.length === 0) {
        questionText.textContent = '⚠️ Load some flashcards first!';
        return;
      }
      enterTestMode();
      tested = true;
      scores = flashcards.map(card => card.defaultScore !== undefined ? card.defaultScore : -1);
      timerSpent = new Array(flashcards.length).fill(0);
      currentIndex = 0;
      isRegularFlashcard = false;
      resultPanel.classList.remove('active');
      
      if (timerEnabled && persistentTimerMode) {
        currentRemaining = Number(timerLength.value) || 30;
      }
      
      renderCard();
    }

    function handleResponse(scoreVal) {
      if (!persistentTimerMode) {
        clearInterval(timerInterval);
      }
      
      if (!tested || flashcards.length === 0) return;
      
      timerSpent[currentIndex] = currentRemaining;
      scores[currentIndex] = scoreVal;
      
      if (currentIndex + 1 < flashcards.length) {
        currentIndex++;
        renderCard();
      } else {
        renderCard();
        if (scores.every(s => s !== -1)) {
          showResults();
        }
      }
    }

    function resetTest() {
      clearInterval(timerInterval);
      tested = false;
      scores = flashcards.map(card => card.defaultScore !== undefined ? card.defaultScore : -1);
      timerSpent = new Array(flashcards.length).fill(0);
      currentIndex = 0;
      isRegularFlashcard = false;
      resultPanel.classList.remove('active');
      exitTestMode();
    }

    function resetAll() {
      clearInterval(timerInterval);
      flashcards = [];
      scores = [];
      timerSpent = [];
      currentIndex = 0;
      tested = false;
      isRegularFlashcard = false;
      resultPanel.classList.remove('active');
      responseButtonsContainer.innerHTML = '';
      questionText.textContent = 'Add notes and load cards.';
      cardCounter.textContent = '';
      progressText.textContent = '📭 0';
      statusBadge.textContent = '⏸ idle';
      extraMessage.textContent = '';
      focusList.innerHTML = '';
      exitTestMode();
    }

    function shuffleCards(){
      const combined = flashcards.map((card, idx) => ({
        card: card,
        score: scores[idx],
        timer: timerSpent[idx]
      }));
      
      combined.sort(() => Math.random() - 0.5);
      
      flashcards = combined.map(item => item.card);
      scores = combined.map(item => item.score);
      timerSpent = combined.map(item => item.timer);
      currentIndex = 0;
      statusBadge.textContent = "🔀 shuffled";
      
      if (timerEnabled && persistentTimerMode) {
        currentRemaining = Number(timerLength.value) || 30;
      }
      
      renderCard();
    }

    function startTimer(){
      if(!timerEnabled || !tested) return;

      if(!persistentTimerMode) {
        clearInterval(timerInterval);
        currentRemaining = Number(timerLength.value) || 15;
      } else {
        if(timerInterval) return;
      }

      statusBadge.textContent = `⏱ ${currentRemaining}s`;

      timerInterval = setInterval(()=>{
        currentRemaining--;
        
        if (currentRemaining < 0) {
          statusBadge.textContent = `⏱ ${currentRemaining}s`;
          if (!negativeTimerEnabled && !persistentTimerMode) {
            clearInterval(timerInterval);
            timerSpent[currentIndex] = currentRemaining;
            scores[currentIndex] = 0;

            if(currentIndex + 1 < flashcards.length){
              currentIndex++;
              renderCard();
            } else {
              renderCard();
              showResults();
            }
          }
        } else {
          statusBadge.textContent = `⏱ ${currentRemaining}s`;
        }
      }, 1000);
    }

    shuffleBtn.addEventListener('click', shuffleCards);
    
    timerBtn.addEventListener('click', () => {
      timerEnabled = !timerEnabled;
      timerBtn.innerHTML = timerEnabled
        ? '<i class="fas fa-clock"></i> Timer: ON'
        : '<i class="fas fa-clock"></i> Timer: OFF';
      
      if (tested) {
        if (timerEnabled) {
          if (persistentTimerMode) {
            currentRemaining = Number(timerLength.value) || 30;
          }
          startTimer();
        } else {
          clearInterval(timerInterval);
          statusBadge.textContent = `📌 ${subject}`;
        }
      }
    });

    timerModeBtn.addEventListener('click', () => {
      persistentTimerMode = !persistentTimerMode;
      timerModeBtn.innerHTML = persistentTimerMode
        ? '<i class="fas fa-sync-alt"></i> Mode: Session'
        : '<i class="fas fa-sync-alt"></i> Mode: Per-Card';
      timerModeBtn.style.background = persistentTimerMode ? '#5865f2' : '';

      if (tested && timerEnabled) {
        clearInterval(timerInterval);
        if (persistentTimerMode) {
          currentRemaining = Number(timerLength.value) || 30;
        }
        startTimer();
      }
    });

    negativeTimerBtn.addEventListener('click', () => {
      negativeTimerEnabled = !negativeTimerEnabled;
      negativeTimerBtn.innerHTML = negativeTimerEnabled
        ? '<i class="fas fa-history"></i> Neg. Timer: ON'
        : '<i class="fas fa-history"></i> Neg. Timer: OFF';
      negativeTimerBtn.style.background = negativeTimerEnabled ? '#5865f2' : '';
    });
    
    exportBtn.addEventListener("click", () => {
      const subject = subjectInput.value.trim();
      const notes = notesInput.value;

      const content = subject + "\n\n" + notes;

      const blob = new Blob([content], {type:"text/plain"});
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "Notes.txt";
      a.click();

      URL.revokeObjectURL(url);
    });

    importBtn.addEventListener("click", () => {
      importFile.click();
    });

    importFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = () => {
        const parts = reader.result.split("\n\n");

        subjectInput.value = parts[0] || "";
        notesInput.value = parts.slice(1).join("\n\n") || "";
      };

      reader.readAsText(file);
    });
    
    loadBtn.addEventListener('click', loadCards);
    testBtn.addEventListener('click', startTest);
    
    themeSelector.addEventListener('change', () => {
      document.body.classList.remove(
        'theme-discord',
        'theme-oldweb',
        'theme-twitter',
        'theme-roblox',
        'theme-yellow',
        'theme-neongreen',
        'theme-minecraft',
        'theme-longhorn',
        'theme-kahoot'
      );

      document.body.classList.add(
        'theme-' + themeSelector.value
      );
    });
    
    resetBtn.addEventListener('click', function() {
      resetTest();
    });
    
    newCardsBtn.addEventListener('click', function() {
      resetAll();
      notesInput.focus();
    });
    
    exitTestBtn.addEventListener('click', function() {
      exitTestMode();
    });

    window.addEventListener('keydown', (e) => {
      if (!tested || flashcards.length === 0) return;
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const card = flashcards[currentIndex];

      // For regular flashcards, space bar flips the card
      if (card.isRegular && e.key === ' ') {
        e.preventDefault();
        const flashcardInner = document.getElementById('flashcardInner');
        if (flashcardInner) {
          flashcardInner.classList.toggle('flipped');
        }
        return;
      }

      if (card.isBlank || card.isSlider) {
        return;
      } else if (card.isTrueFalse) {
        if (e.key === '1') {
          const scoreVal = (true === card.expectedBool) ? 3 : 0;
          handleResponse(scoreVal);
        } else if (e.key === '2') {
          const scoreVal = (false === card.expectedBool) ? 3 : 0;
          handleResponse(scoreVal);
        }
      } else {
        if (e.key === '1') {
          handleResponse(0);
        } else if (e.key === '2') {
          handleResponse(1);
        } else if (e.key === '3') {
          handleResponse(2);
        } else if (e.key === '4') {
          handleResponse(3);
        }
      }
    });

    loadCards();
  })();
</script>
</body>
</html>
