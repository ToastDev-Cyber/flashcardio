<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcardio</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Roboto:wght@400;700&family=VT323&family=Press+Start+2P&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <!-- Fontawesome (Discord-like icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    body {
      background: #36393f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }

    body.test-active {
      padding: 0;
      background: #1e1f22;
    }

    .flashcardio {
      max-width: 880px;
      width: 100%;
      background: #2f3136;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      padding: 2rem 2rem 2.2rem;
      color: #dcddde;
      transition: all 0.3s ease;
      position: relative;
    }

    body.test-active .flashcardio {
      max-width: 100%;
      border-radius: 0;
      padding: 0;
      background: #1e1f22;
      box-shadow: none;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #40444b;
      padding-bottom: 1rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }

    body.test-active .header {
      display: none;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #5865f2, #8ea1f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 i {
      background: none;
      -webkit-text-fill-color: #5865f2;
      font-size: 2.1rem;
    }

    .header .badge {
      background: #40444b;
      border-radius: 40px;
      padding: 0.2rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #b9bbbe;
    }

    /* input section - hidden during test */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.8rem;
      transition: all 0.3s ease;
    }

    body.test-active .input-section {
      display: none !important;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .input-row label {
      font-weight: 600;
      color: #b9bbbe;
      min-width: 70px;
      font-size: 0.95rem;
    }

    .input-row input, 
    .input-row textarea {
      flex: 1;
      background: #40444b;
      border: none;
      border-radius: 12px;
      padding: 0.7rem 1rem;
      color: #f2f3f5;
      font-size: 0.95rem;
      outline: none;
      transition: 0.15s;
      min-width: 200px;
      resize: vertical;
    }

    .input-row input:focus, 
    .input-row textarea:focus {
      background: #4e535c;
      box-shadow: 0 0 0 2px #5865f2;
    }

    .input-row textarea {
      min-height: 70px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
      justify-content: flex-end;
      align-items: center;
    }

    .timer-container {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #40444b;
      padding: 0.3rem 0.8rem;
      border-radius: 40px;
      border: 1px solid transparent;
    }

    .timer-container input {
      background: #2f3136;
      border: none;
      border-radius: 8px;
      padding: 0.3rem 0.5rem;
      color: #f2f3f5;
      font-size: 0.9rem;
      outline: none;
      width: 60px;
      text-align: center;
    }

    .timer-container input:focus {
      box-shadow: 0 0 0 2px #5865f2;
    }

    .btn {
      background: #40444b;
      border: none;
      border-radius: 40px;
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: #dcddde;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: #5865f2;
      color: white;
    }
    .btn-primary:hover {
      background: #4752c4;
    }
    .btn-success {
      background: #3ba55d;
      color: white;
    }
    .btn-success:hover {
      background: #2d8b4e;
    }
    .btn-secondary {
      background: #4e535c;
      color: white;
    }
    .btn-secondary:hover {
      background: #5d626c;
    }
    .btn-danger {
      background: #ed4245;
      color: white;
    }
    .btn-danger:hover {
      background: #c03537;
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* flashcard area - normal mode */
    .flashcard-area {
      background: #292b2f;
      border-radius: 20px;
      padding: 1.5rem 1.5rem 1rem;
      margin: 1.8rem 0 1.2rem;
      min-height: 140px;
      border-left: 4px solid #5865f2;
      transition: all 0.3s ease;
    }

    /* flashcard area - test mode (full screen) */
    body.test-active .flashcard-area {
      background: transparent;
      border-radius: 0;
      padding: 3rem 4rem;
      margin: 0;
      min-height: 80vh;
      border-left: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .flashcard-prompt {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 0.8rem;
      color: #f2f3f5;
    }

    body.test-active .flashcard-prompt {
      font-size: 2.2rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    body.test-active .flashcard-prompt small {
      font-size: 1.2rem;
      display: block;
      margin-top: 0.5rem;
    }

    .flashcard-prompt small {
      font-weight: 400;
      color: #8e9297;
      font-size: 0.9rem;
      margin-left: 10px;
    }

    .response-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 0.8rem;
    }

    body.test-active .response-buttons {
      gap: 16px;
      margin-top: 2rem;
      justify-content: center;
    }

    .response-btn {
      background: #40444b;
      border: none;
      border-radius: 40px;
      padding: 0.5rem 1.2rem;
      font-weight: 500;
      color: #dcddde;
      transition: 0.1s;
      cursor: pointer;
      flex: 1 0 auto;
      min-width: 100px;
      border: 1px solid transparent;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    body.test-active .response-btn {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      min-width: 140px;
      flex: 0 1 auto;
    }

    .response-btn kbd {
      background: #2f3136;
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      font-size: 0.75rem;
      color: #b9bbbe;
      margin-left: 6px;
      border: 1px solid #40444b;
    }

    body.test-active .response-btn kbd {
      font-size: 0.85rem;
      margin-left: 8px;
    }

    .response-btn:hover {
      background: #4e535c;
      border-color: #5865f2;
    }
    .response-btn.selected {
      background: #5865f2;
      color: white;
      border-color: #5865f2;
    }
    .response-btn.selected kbd {
      background: #4752c4;
      color: white;
      border-color: #5865f2;
    }

    .progress-indicator {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #8e9297;
      margin-top: 0.8rem;
    }

    body.test-active .progress-indicator {
      font-size: 1.1rem;
      margin-top: 2rem;
      padding: 0 1rem;
      justify-content: center;
      gap: 3rem;
    }

    .result-panel {
      background: #1e1f22;
      border-radius: 20px;
      padding: 1.4rem 1.8rem;
      margin-top: 1.8rem;
      border-left: 4px solid #3ba55d;
      display: none;
    }

    .result-panel.active {
      display: block;
    }

    body.test-active .result-panel {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      border-radius: 24px;
      padding: 2.5rem;
    }

    .result-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f2f3f5;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.8rem;
    }

    body.test-active .result-title {
      font-size: 2rem;
      justify-content: center;
    }

    .focus-list {
      list-style: none;
      margin-top: 0.6rem;
    }

    .focus-list li {
      background: #2f3136;
      margin: 6px 0;
      padding: 0.6rem 1rem;
      border-radius: 14px;
      border-left: 3px solid #ed4245;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    body.test-active .focus-list li {
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
    }

    .focus-list .tag {
      background: #ed4245;
      color: white;
      border-radius: 40px;
      padding: 0.1rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .reset-area {
      margin-top: 1.2rem;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    body.test-active .reset-area {
      justify-content: center;
      margin-top: 2rem;
    }

    body.test-active .reset-area .btn {
      padding: 0.8rem 2rem;
      font-size: 1rem;
    }

    .status-message {
      color: #b9bbbe;
      font-size: 0.9rem;
      margin-top: 0.8rem;
      font-style: italic;
    }

    body.test-active .status-message {
      font-size: 1.1rem;
      text-align: center;
    }

    .footer {
      margin-top: 1.4rem;
      font-size: 0.8rem;
      color: #72767d;
      display: flex;
      gap: 20px;
      border-top: 1px solid #40444b;
      padding-top: 1rem;
    }

    body.test-active .footer {
      display: none;
    }

    .exit-test-btn {
      margin-left: auto;
    }

    .theme-selector {
      background: #40444b;
      color: #dcddde;
      border: none;
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      outline: none;
    }

    /* ===== THEMES (Backgrounds, Component Layouts & Adaptive Typography) ===== */

    /* Discord Black */
    body.theme-discord {
      background: #36393f !important;
      color: #dcddde !important;
    }
    body.theme-discord .flashcardio {
      background: #2f3136 !important;
      color: #dcddde !important;
    }
    body.theme-discord .flashcard-area {
      background: #292b2f !important;
    }
    body.theme-discord .input-row input, 
    body.theme-discord .input-row textarea,
    body.theme-discord .timer-container,
    body.theme-discord .timer-container input,
    body.theme-discord .theme-selector,
    body.theme-discord .badge,
    body.theme-discord .response-btn,
    body.theme-discord .btn {
      background: #40444b !important;
      color: #dcddde !important;
    }

    /* Average 2009 Website (Old Windows XP / Classic PC Theme - Sharp Squares, Beveled Look) */
    body.theme-oldweb {
      background: #3a6ea5 !important;
      color: #000000 !important;
      /* Simulated vintage CRT scanline overlay */
      background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)) !important;
      background-size: 100% 4px, 6px 100% !important;
    }
    body.theme-oldweb .flashcardio {
      background: #ece9d8 !important;
      color: #000000 !important;
      border-radius: 0 !important;
      box-shadow: inset 1px 1px #ffffff, inset -1px -1px #000000, 3px 3px 10px rgba(0,0,0,0.5) !important;
      border: 2px solid #0055ea !important;
      padding: 0 !important;
    }
    /* Retro Window Titlebar */
    body.theme-oldweb .flashcardio::before {
      content: "Flashcardio - Microsoft Internet Explorer";
      display: block;
      background: linear-gradient(to right, #0055ea, #2884eb);
      color: #ffffff;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 4px 8px;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }
    body.theme-oldweb .flashcard-area {
      background: #ffffff !important;
      border-radius: 0 !important;
      border: 2px inset #7f7f7f !important;
      border-left: 6px solid #0000ff !important;
      margin: 10px !important;
      padding: 1rem !important;
    }
    body.theme-oldweb .header {
      border-bottom: 2px groove #808080 !important;
      padding: 0 1rem 0.5rem 1rem !important;
      margin-bottom: 1rem !important;
    }
    body.theme-oldweb .header h1 {
      background: none !important;
      -webkit-text-fill-color: #000080 !important;
      color: #000080 !important;
      font-size: 1.6rem !important;
    }
    body.theme-oldweb .header h1 i {
      -webkit-text-fill-color: #000080 !important;
      color: #000080 !important;
    }
    body.theme-oldweb .input-row input, 
    body.theme-oldweb .input-row textarea,
    body.theme-oldweb .timer-container,
    body.theme-oldweb .timer-container input,
    body.theme-oldweb .theme-selector,
    body.theme-oldweb .badge,
    body.theme-oldweb .response-btn,
    body.theme-oldweb .btn {
      background: #f4f0ec !important;
      color: #000000 !important;
      border-radius: 0 !important;
      border: 2px outset #ffffff !important;
      border-right-color: #404040 !important;
      border-bottom-color: #404040 !important;
    }
    body.theme-oldweb .btn:active, 
    body.theme-oldweb .response-btn:active {
      border: 2px inset #ffffff !important;
      border-top-color: #404040 !important;
      border-left-color: #404040 !important;
    }
    body.theme-oldweb .input-row input:focus, 
    body.theme-oldweb .input-row textarea:focus {
      background: #ffffff !important;
      box-shadow: none !important;
      border: 2px inset #000000 !important;
    }
    body.theme-oldweb .flashcard-prompt,
    body.theme-oldweb .input-row label,
    body.theme-oldweb .progress-indicator,
    body.theme-oldweb .footer,
    body.theme-oldweb .status-message,
    body.theme-oldweb .result-title,
    body.theme-oldweb .badge {
      color: #000000 !important;
      background: transparent !important;
    }
    body.theme-oldweb .result-panel {
      background: #f4f0ec !important;
      border-radius: 0 !important;
      border: 2px inset #7f7f7f !important;
      border-left: 6px solid #00aa00 !important;
    }
    body.theme-oldweb .focus-list li {
      background: #ffffff !important;
      border-radius: 0 !important;
      border: 1px solid #7f7f7f !important;
      border-left: 4px solid #cc0000 !important;
    }
    body.theme-oldweb .footer {
      border-top: 1px groove #808080 !important;
      margin: 10px !important;
      padding: 5px !important;
    }

    /* Twitter Black */
    body.theme-twitter {
      background: #000000 !important;
      color: #f7f9f9 !important;
    }
    body.theme-twitter .flashcardio {
      background: #15202b !important;
      color: #f7f9f9 !important;
      border: 1px solid #38444d !important;
    }
    body.theme-twitter .flashcard-area {
      background: #192734 !important;
    }
    body.theme-twitter .header {
      border-bottom-color: #38444d !important;
    }
    body.theme-twitter .header h1 {
      background: none !important;
      -webkit-text-fill-color: #1da1f2 !important;
      color: #1da1f2 !important;
    }
    body.theme-twitter .header h1 i {
      -webkit-text-fill-color: #1da1f2 !important;
      color: #1da1f2 !important;
    }
    body.theme-twitter .input-row input, 
    body.theme-twitter .input-row textarea,
    body.theme-twitter .timer-container,
    body.theme-twitter .timer-container input,
    body.theme-twitter .theme-selector,
    body.theme-twitter .badge,
    body.theme-twitter .response-btn,
    body.theme-twitter .btn {
      background: #253341 !important;
      color: #f7f9f9 !important;
      border: 1px solid #38444d !important;
    }
    body.theme-twitter .flashcard-prompt,
    body.theme-twitter .input-row label,
    body.theme-twitter .progress-indicator,
    body.theme-twitter .footer,
    body.theme-twitter .status-message,
    body.theme-twitter .result-title {
      color: #f7f9f9 !important;
    }

    /* Roblox Light Mode */
    body.theme-roblox {
      background: #eeeeee !important;
      color: #111111 !important;
    }
    body.theme-roblox .flashcardio {
      background: #ffffff !important;
      color: #111111 !important;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important;
    }
    body.theme-roblox .flashcard-area {
      background: #f5f5f5 !important;
      border-left-color: #0074e8 !important;
    }
    body.theme-roblox .header {
      border-bottom-color: #dddddd !important;
    }
    body.theme-roblox .header h1 {
      background: none !important;
      -webkit-text-fill-color: #0074e8 !important;
      color: #0074e8 !important;
    }
    body.theme-roblox .header h1 i {
      -webkit-text-fill-color: #0074e8 !important;
      color: #0074e8 !important;
    }
    body.theme-roblox .input-row input, 
    body.theme-roblox .input-row textarea,
    body.theme-roblox .timer-container,
    body.theme-roblox .timer-container input,
    body.theme-roblox .theme-selector,
    body.theme-roblox .badge,
    body.theme-roblox .response-btn,
    body.theme-roblox .btn {
      background: #e9e9e9 !important;
      color: #111111 !important;
      border: 1px solid #cccccc !important;
    }
    body.theme-roblox .flashcard-prompt,
    body.theme-roblox .input-row label,
    body.theme-roblox .progress-indicator,
    body.theme-roblox .footer,
    body.theme-roblox .status-message,
    body.theme-roblox .result-title {
      color: #222222 !important;
    }

    /* YELOOW */
    body.theme-yellow {
      background: #ffd700 !important;
      color: #1a1a1a !important;
    }
    body.theme-yellow .flashcardio {
      background: #ffea75 !important;
      color: #1a1a1a !important;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2) !important;
    }
    body.theme-yellow .flashcard-area {
      background: #fff099 !important;
      border-left-color: #d4ac0d !important;
    }
    body.theme-yellow .header {
      border-bottom-color: #e5c158 !important;
    }
    body.theme-yellow .header h1 {
      background: none !important;
      -webkit-text-fill-color: #7d6608 !important;
      color: #7d6608 !important;
    }
    body.theme-yellow .header h1 i {
      -webkit-text-fill-color: #7d6608 !important;
      color: #7d6608 !important;
    }
    body.theme-yellow .input-row input, 
    body.theme-yellow .input-row textarea,
    body.theme-yellow .timer-container,
    body.theme-yellow .timer-container input,
    body.theme-yellow .theme-selector,
    body.theme-yellow .badge,
    body.theme-yellow .response-btn,
    body.theme-yellow .btn {
      background: #fdf2a4 !important;
      color: #1a1a1a !important;
      border: 1px solid #d4ac0d !important;
    }
    body.theme-yellow .flashcard-prompt,
    body.theme-yellow .input-row label,
    body.theme-yellow .progress-indicator,
    body.theme-yellow .footer,
    body.theme-yellow .status-message,
    body.theme-yellow .result-title {
      color: #222222 !important;
    }

    /* Neon Dark Green */
    body.theme-neongreen {
      background: #001000 !important;
      color: #00ff66 !important;
    }
    body.theme-neongreen .flashcardio {
      background: #002000 !important;
      color: #00ff66 !important;
      box-shadow: 0 0 30px #00ff00 !important;
      border: 1px solid #00aa33 !important;
    }
    body.theme-neongreen .flashcard-area {
      background: #003300 !important;
      border-left-color: #00ff44 !important;
    }
    body.theme-neongreen .header {
      border-bottom-color: #004400 !important;
    }
    body.theme-neongreen .header h1 {
      background: linear-gradient(135deg,#00ff44,#00ffaa) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
    }
    body.theme-neongreen .header h1 i {
      -webkit-text-fill-color: #00ff44 !important;
      color: #00ff44 !important;
    }
    body.theme-neongreen .input-row input, 
    body.theme-neongreen .input-row textarea,
    body.theme-neongreen .timer-container,
    body.theme-neongreen .timer-container input,
    body.theme-neongreen .theme-selector,
    body.theme-neongreen .badge,
    body.theme-neongreen .response-btn,
    body.theme-neongreen .btn {
      background: #004400 !important;
      color: #00ff66 !important;
      border: 1px solid #008822 !important;
    }
    body.theme-neongreen .flashcard-prompt,
    body.theme-neongreen .input-row label,
    body.theme-neongreen .progress-indicator,
    body.theme-neongreen .footer,
    body.theme-neongreen .status-message,
    body.theme-neongreen .result-title {
      color: #00ff88 !important;
    }
  
    /* Theme Fonts (Excluding FontAwesome elements using :not([class*="fa-"])) */
    body.theme-discord *:not([class*="fa-"]), body.theme-discord {font-family:"Segoe UI","Helvetica Neue",sans-serif!important;}
    body.theme-oldweb *:not([class*="fa-"]), body.theme-oldweb {font-family:Tahoma,Verdana,Arial,sans-serif!important;}
    body.theme-twitter *:not([class*="fa-"]), body.theme-twitter {font-family:Roboto,Helvetica,Arial,sans-serif!important;}
    body.theme-roblox *:not([class*="fa-"]), body.theme-roblox {font-family:Nunito,sans-serif!important;}
    body.theme-yellow *:not([class*="fa-"]), body.theme-yellow {font-family:Caveat,cursive!important;}
    body.theme-neongreen *:not([class*="fa-"]), body.theme-neongreen {font-family:VT323,monospace!important;letter-spacing:1px;}
    body.theme-neongreen .header h1 *:not([class*="fa-"]), body.theme-neongreen .header h1{font-family:"Press Start 2P",monospace!important;font-size:1.3rem;}

  image-rendering: pixelated;
}

  box-shadow:
    inset 3px 3px #d0d0d0,
    inset -3px -3px #555 !important;
}

/* Inputs become item slots */
body.theme-minecraft .input-row input,
body.theme-minecraft .input-row textarea,
body.theme-minecraft .timer-container,
body.theme-minecraft .timer-container input,
body.theme-minecraft .theme-selector,
body.theme-minecraft .badge {
  background: #8b8b8b !important;
  color: white !important;
  border-radius: 0 !important;
  border: 4px solid #373737 !important;
  box-shadow:
    inset 3px 3px #cfcfcf,
    inset -3px -3px #555 !important;
  font-family: "VT323", monospace !important;
  font-size: 1.2rem !important;
}

/* Buttons look like inventory slots */
body.theme-minecraft .btn,

body.theme-minecraft .btn:hover,
body.theme-minecraft .response-btn:hover {

}

/* Selected item slot */

  border-color: #ffffff !important;
}

  padding: 8px !important;
  border: 3px solid #000 !important;
  color: #55ff55 !important;
  font-family: "VT323", monospace !important;
}

body.theme-minecraft .result-panel {
  background: #8b8b8b !important;
  border-radius: 0 !important;
  border: 5px solid #373737 !important;
}

body.theme-minecraft .focus-list li {
  background: #555 !important;
  color: white !important;
  border-radius: 0 !important;
  border-left: 6px solid #aa3333 !important;
}

/* Pixel font */

  </style>
</head>
<body>
<div class="flashcardio" id="app">
  <!-- header -->
  <div class="header">
    <h1><i class="fas fa-brain"></i> Flashcardio</h1>
    <span class="badge"><i class="fas fa-tasks"></i> active</span>
    <span style="margin-left: auto; color: inherit; font-size: 0.9rem;"><i class="fas fa-comments"></i>probably a vibe</span>
    <select id="themeSelector" class="theme-selector">
      <option value="discord">Discord Black</option>
      <option value="oldweb">Average 2009 Website</option>
      <option value="twitter">Twitter Black</option>
      <option value="roblox">Roblox Light Mode</option>
      <option value="yellow">YELOOW</option>
      <option value="neongreen">Neon Dark Green</option>
      <option value="minecraft">Minecraft Inventory</option>
    </select>
  </div>

  <!-- input section -->
  <div class="input-section" id="inputSection">
    <div class="input-row">
      <label><i class="fas fa-book"></i> Subject</label>
      <input type="text" id="subjectInput" placeholder="e.g. History, Python, Anatomy" value="Biology 101">
    </div>
    <div class="input-row">
      <label><i class="fas fa-list-ul"></i> Notes</label>
      <textarea id="notesInput" placeholder="One item per line&#10;e.g.&#10;Mitochondria is powerhouse || true&#10;Earth is flat || false&#10;DNA double helix">Mitochondria is powerhouse || true
Earth is flat || false
DNA double helix
Cell membrane function || true
The sky is green || false</textarea>
    </div>
    <div class="button-group">
      <div class="timer-container">
        <i class="fas fa-hourglass-half" style="font-size: 0.85rem;"></i>
        <input type="number" id="timerLength" min="1" max="600" value="30">
        <span style="font-size:0.85rem; padding-right:4px;">s</span>
      </div>
      <button class="btn btn-primary" id="loadBtn"><i class="fas fa-upload"></i> Load cards</button>
      <button class="btn btn-success" id="testBtn"><i class="fas fa-pen-fancy"></i> Test</button>
      <button class="btn btn-secondary" id="shuffleBtn"><i class="fas fa-random"></i> Shuffle</button>
      <button class="btn btn-secondary" id="timerBtn"><i class="fas fa-clock"></i> Timer: OFF</button>
      <button class="btn btn-secondary" id="timerModeBtn"><i class="fas fa-sync-alt"></i> Mode: Per-Card</button>
      <button class="btn btn-secondary" id="negativeTimerBtn"><i class="fas fa-history"></i> Neg. Timer: OFF</button>
    </div>
  </div>

  <!-- flashcard area -->
  <div class="flashcard-area" id="flashcardArea">
    <div class="flashcard-prompt">
      <i class="fas fa-quote-left" style="margin-right: 6px;"></i>
      <span id="questionText">Add your subject & notes, then click "Test"</span>
      <small id="cardCounter"></small>
    </div>
    <div id="responseButtons" class="response-buttons">
      <!-- Dynamically filled with either 4-tier memory buttons or True/False buttons -->
    </div>
    <div class="progress-indicator">
      <span id="progressText"><i class="fas fa-chevron-circle-right"></i> 0 / 0</span>
      <span id="statusBadge" style="padding:0.2rem 1rem; border-radius:40px;">ready</span>
    </div>
  </div>

  <!-- result panel -->
  <div class="result-panel" id="resultPanel">
    <div class="result-title"><i class="fas fa-bullseye" style="color:#ed4245;"></i> Focus on these</div>
    <div id="focusContainer">
      <ul class="focus-list" id="focusList"></ul>
    </div>
    <div class="reset-area">
      <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset session</button>
      <button class="btn btn-secondary" id="newCardsBtn"><i class="fas fa-plus-circle"></i> New cards</button>
      <button class="btn btn-danger exit-test-btn" id="exitTestBtn"><i class="fas fa-times"></i> Exit test</button>
    </div>
    <div id="extraMessage" class="status-message"></div>
  </div>

  <div class="footer">
    <span><i class="fas fa-check-circle" style="color:#3ba55d;"></i> honest answers</span>
    <span><i class="fas fa-robot"></i> smart focus</span>
  </div>
</div>

<script>
  (function(){
    let flashcards = [];
    let currentIndex = 0;
    let scores = [];
    let timerSpent = []; 
    let tested = false;
    let subject = 'Biology 101';

    let timerEnabled = false;
    let persistentTimerMode = false;
    let negativeTimerEnabled = false;
    let timerInterval = null;
    let currentRemaining = 30;

    const subjectInput = document.getElementById('subjectInput');
    const notesInput = document.getElementById('notesInput');
    const loadBtn = document.getElementById('loadBtn');
    const testBtn = document.getElementById('testBtn');
    const timerLength = document.getElementById('timerLength');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const timerBtn = document.getElementById('timerBtn');
    const timerModeBtn = document.getElementById('timerModeBtn');
    const negativeTimerBtn = document.getElementById('negativeTimerBtn');
    const questionText = document.getElementById('questionText');
    const cardCounter = document.getElementById('cardCounter');
    const progressText = document.getElementById('progressText');
    const statusBadge = document.getElementById('statusBadge');
    const responseButtonsContainer = document.getElementById('responseButtons');
    const resultPanel = document.getElementById('resultPanel');
    const focusList = document.getElementById('focusList');
    const extraMessage = document.getElementById('extraMessage');
    const resetBtn = document.getElementById('resetBtn');
    const newCardsBtn = document.getElementById('newCardsBtn');
    const exitTestBtn = document.getElementById('exitTestBtn');
    const app = document.getElementById('app');
    const body = document.body;
    const themeSelector = document.getElementById("themeSelector");

    function enterTestMode() {
      body.classList.add('test-active');
      void body.offsetWidth;
    }

    function exitTestMode() {
      clearInterval(timerInterval);
      body.classList.remove('test-active');
      tested = false;
      scores = flashcards.map(card => card.defaultScore !== undefined ? card.defaultScore : -1);
      timerSpent = new Array(flashcards.length).fill(0);
      currentIndex = 0;
      resultPanel.classList.remove('active');
      responseButtonsContainer.innerHTML = '';
      if (flashcards.length > 0) {
        questionText.textContent = 'Press "Test" to start.';
        cardCounter.textContent = `${flashcards.length} cards ready`;
        progressText.textContent = `⏳ ${flashcards.length} cards`;
        statusBadge.textContent = '📋 loaded';
      } else {
        questionText.textContent = 'Add notes and load cards.';
        cardCounter.textContent = '';
        progressText.textContent = '📭 0';
        statusBadge.textContent = '⏸ idle';
      }
      extraMessage.textContent = '';
    }

    function renderCard() {
      if (!tested || flashcards.length === 0) {
        if (!persistentTimerMode) clearInterval(timerInterval);
        if (flashcards.length === 0) {
          questionText.textContent = 'No flashcards. Load some notes!';
          cardCounter.textContent = '';
          progressText.textContent = '📭 0 / 0';
          statusBadge.textContent = '⏸ idle';
        } else {
          questionText.textContent = 'Press "Test" to start.';
          cardCounter.textContent = `${flashcards.length} cards ready`;
          progressText.textContent = `⏳ ${flashcards.length} cards`;
          statusBadge.textContent = '📋 loaded';
        }
        responseButtonsContainer.innerHTML = '';
        return;
      }

      const card = flashcards[currentIndex];
      startTimer();
      questionText.textContent = card.question || 'Untitled';
      cardCounter.textContent = `${currentIndex+1} / ${flashcards.length}`;
      progressText.textContent = `🧠 ${scores.filter(s => s !== -1).length} / ${flashcards.length} answered`;
      if (!timerEnabled) {
        statusBadge.textContent = `📌 ${subject}`;
      }

      const currentScore = scores[currentIndex];
      
      if (card.isTrueFalse) {
        responseButtonsContainer.innerHTML = `
          <button class="response-btn ${currentScore === 3 ? 'selected' : ''}" data-val="true"><i class="fas fa-check" style="color:#3ba55d;"></i> True <kbd>1</kbd></button>
          <button class="response-btn ${currentScore === 0 ? 'selected' : ''}" data-val="false"><i class="fas fa-times" style="color:#ed4245;"></i> False <kbd>2</kbd></button>
        `;
      } else {
        responseButtonsContainer.innerHTML = `
          <button class="response-btn ${currentScore === 0 ? 'selected' : ''}" data-score="0"><i class="fas fa-skull"></i> Forgor <kbd>1</kbd></button>
          <button class="response-btn ${currentScore === 1 ? 'selected' : ''}" data-score="1"><i class="fas fa-question-circle"></i> Partially recall <kbd>2</kbd></button>
          <button class="response-btn ${currentScore === 2 ? 'selected' : ''}" data-score="2"><i class="fas fa-check-circle"></i> Recall <kbd>3</kbd></button>
          <button class="response-btn ${currentScore === 3 ? 'selected' : ''}" data-score="3"><i class="fas fa-star"></i> Easily recall <kbd>4</kbd></button>
        `;
      }

      responseButtonsContainer.querySelectorAll('.response-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const targetBtn = e.currentTarget;
          if (card.isTrueFalse) {
            const userChoice = targetBtn.dataset.val === 'true';
            const scoreVal = userChoice === card.expectedBool ? 3 : 0;
            handleResponse(scoreVal);
          } else {
            const val = parseInt(targetBtn.dataset.score, 10);
            handleResponse(val);
          }
        });
      });

      if (scores.every(s => s !== -1)) {
        showResults();
      }
    }

    function computeFocus() {
      const focusItems = [];
      for (let i = 0; i < flashcards.length; i++) {
        const score = scores[i];
        if (score === 0 || score === 1) {
          const overflow = timerSpent[i];
          let timeLabel = '';
          if (overflow < 0) {
            timeLabel = ` (${overflow}s overtime)`;
          } else if (overflow > 0 && timerEnabled) {
            timeLabel = ` (${overflow}s left)`;
          }
          const labelText = flashcards[i].isTrueFalse ? 'Incorrect' : (score === 0 ? 'Forgor' : 'Partially recall');
          focusItems.push({
            question: (flashcards[i].question || 'Untitled') + timeLabel,
            score: score,
            label: labelText
          });
        }
      }
      return focusItems;
    }

    function showResults() {
      clearInterval(timerInterval);
      const focusItems = computeFocus();
      resultPanel.classList.add('active');
      focusList.innerHTML = '';
      if (focusItems.length === 0) {
        focusList.innerHTML = `<li style="border-left-color: #3ba55d; background: rgba(0,0,0,0.05);"><i class="fas fa-check-circle" style="color:#3ba55d;"></i> All cards mastered! Keep it up 🎉</li>`;
        extraMessage.textContent = '✨ You answered everything correctly. Great job!';
      } else {
        focusItems.forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `<span><i class="fas fa-${item.score === 0 ? 'skull' : 'question-circle'}" style="margin-right:10px; color:${item.score === 0 ? '#ed4245' : '#faa81a'};"></i> ${item.question}</span>
                          <span class="tag">${item.label}</span>`;
          focusList.appendChild(li);
        });
        extraMessage.textContent = `🔁 ${focusItems.length} card(s) need extra review. Focus on these.`;
      }
      responseButtonsContainer.innerHTML = '';
      statusBadge.textContent = '✅ done';
    }

    function loadCards() {
      clearInterval(timerInterval);
      const rawSubject = subjectInput.value.trim() || 'Subject';
      subject = rawSubject;
      const rawNotes = notesInput.value;
      const lines = rawNotes.split('\n').map(line => line.trim()).filter(line => line.length > 0);
      
      if (lines.length === 0) {
        flashcards = [];
        questionText.textContent = '⚠️ No notes found. Add items line by line.';
        cardCounter.textContent = '';
        progressText.textContent = '📭 0';
        statusBadge.textContent = '⚠️ empty';
        responseButtonsContainer.innerHTML = '';
        resultPanel.classList.remove('active');
        tested = false;
        scores = [];
        timerSpent = [];
        exitTestMode();
        return;
      }

      flashcards = lines.map(line => {
        let questionText = line;
        let defaultScore = undefined; 
        let isTrueFalse = false;
        let expectedBool = false;

        if (line.endsWith('|| true')) {
          questionText = line.slice(0, line.lastIndexOf('|| true')).trim();
          isTrueFalse = true;
          expectedBool = true;
        } else if (line.endsWith('|| false')) {
          questionText = line.slice(0, line.lastIndexOf('|| false')).trim();
          isTrueFalse = true;
          expectedBool = false;
        }

        return { 
          question: questionText, 
          defaultScore: defaultScore, 
          isTrueFalse: isTrueFalse, 
          expectedBool: expectedBool 
        };
      });

      tested = false;
      scores = flashcards.map(card => card.defaultScore !== undefined ? card.defaultScore : -1);
      timerSpent = new Array(flashcards.length).fill(0);
      currentIndex = 0;
      resultPanel.classList.remove('active');
      responseButtonsContainer.innerHTML = '';
      questionText.textContent = 'Press "Test" to start.';
      cardCounter.textContent = `${flashcards.length} cards ready`;
      progressText.textContent = `⏳ ${flashcards.length} cards`;
      statusBadge.textContent = '📋 loaded';
      extraMessage.textContent = '';
      exitTestMode();
    }

    function startTest() {
      if (flashcards.length === 0) {
        questionText.textContent = '⚠️ Load some flashcards first!';
        return;
      }
      enterTestMode();
      tested = true;
      scores = flashcards.map(card => card.defaultScore !== undefined ? card.defaultScore : -1);
      timerSpent = new Array(flashcards.length).fill(0);
      currentIndex = 0;
      resultPanel.classList.remove('active');
      
      if (timerEnabled && persistentTimerMode) {
        currentRemaining = Number(timerLength.value) || 30;
      }
      
      renderCard();
    }

    function handleResponse(scoreVal) {
      if (!persistentTimerMode) {
        clearInterval(timerInterval);
      }
      
      if (!tested || flashcards.length === 0) return;
      
      timerSpent[currentIndex] = currentRemaining;

      scores[currentIndex] = scoreVal;
      if (currentIndex + 1 < flashcards.length) {
        currentIndex++;
        renderCard();
      } else {
        renderCard();
        if (scores.every(s => s !== -1)) {
          showResults();
        }
      }
    }

    function resetAll() {
      clearInterval(timerInterval);
      flashcards = [];
      scores = [];
      timerSpent = [];
      currentIndex = 0;
      tested = false;
      resultPanel.classList.remove('active');
      responseButtonsContainer.innerHTML = '';
      questionText.textContent = 'Add notes and load cards.';
      cardCounter.textContent = '';
      progressText.textContent = '📭 0';
      statusBadge.textContent = '⏸ idle';
      extraMessage.textContent = '';
      focusList.innerHTML = '';
      exitTestMode();
    }

    function shuffleCards(){
      const combined = flashcards.map((card, idx) => ({
        card: card,
        score: scores[idx],
        timer: timerSpent[idx]
      }));
      
      combined.sort(() => Math.random() - 0.5);
      
      flashcards = combined.map(item => item.card);
      scores = combined.map(item => item.score);
      timerSpent = combined.map(item => item.timer);
      currentIndex = 0;
      statusBadge.textContent = "🔀 shuffled";
      
      if (timerEnabled && persistentTimerMode) {
        currentRemaining = Number(timerLength.value) || 30;
      }
      
      renderCard();
    }

    function startTimer(){
      if(!timerEnabled || !tested) return;

      if(!persistentTimerMode) {
        clearInterval(timerInterval);
        currentRemaining = Number(timerLength.value) || 15;
      } else {
        if(timerInterval) return;
      }

      statusBadge.textContent = `⏱ ${currentRemaining}s`;

      timerInterval = setInterval(()=>{
        currentRemaining--;
        
        if (currentRemaining < 0) {
          statusBadge.textContent = `⏱ ${currentRemaining}s`;
          if (!negativeTimerEnabled && !persistentTimerMode) {
            clearInterval(timerInterval);
            timerSpent[currentIndex] = currentRemaining;
            scores[currentIndex] = 0;

            if(currentIndex + 1 < flashcards.length){
              currentIndex++;
              renderCard();
            } else {
              renderCard();
              showResults();
            }
          }
        } else {
          statusBadge.textContent = `⏱ ${currentRemaining}s`;
        }
      }, 1000);
    }

    shuffleBtn.addEventListener('click', shuffleCards);
    
    timerBtn.addEventListener('click', () => {
      timerEnabled = !timerEnabled;
      timerBtn.innerHTML = timerEnabled
        ? '<i class="fas fa-clock"></i> Timer: ON'
        : '<i class="fas fa-clock"></i> Timer: OFF';
      
      if (tested) {
        if (timerEnabled) {
          if (persistentTimerMode) {
            currentRemaining = Number(timerLength.value) || 30;
          }
          startTimer();
        } else {
          clearInterval(timerInterval);
          statusBadge.textContent = `📌 ${subject}`;
        }
      }
    });

    timerModeBtn.addEventListener('click', () => {
      persistentTimerMode = !persistentTimerMode;
      timerModeBtn.innerHTML = persistentTimerMode
        ? '<i class="fas fa-sync-alt"></i> Mode: Session'
        : '<i class="fas fa-sync-alt"></i> Mode: Per-Card';
      timerModeBtn.style.background = persistentTimerMode ? '#5865f2' : '';

      if (tested && timerEnabled) {
        clearInterval(timerInterval);
        if (persistentTimerMode) {
          currentRemaining = Number(timerLength.value) || 30;
        }
        startTimer();
      }
    });

    negativeTimerBtn.addEventListener('click', () => {
      negativeTimerEnabled = !negativeTimerEnabled;
      negativeTimerBtn.innerHTML = negativeTimerEnabled
        ? '<i class="fas fa-history"></i> Neg. Timer: ON'
        : '<i class="fas fa-history"></i> Neg. Timer: OFF';
      negativeTimerBtn.style.background = negativeTimerEnabled ? '#5865f2' : '';
    });

    loadBtn.addEventListener('click', loadCards);
    testBtn.addEventListener('click', startTest);
    
    themeSelector.addEventListener('change', () => {
      document.body.classList.remove(
        'theme-discord',
        'theme-oldweb',
        'theme-twitter',
        'theme-roblox',
        'theme-yellow',
        'theme-neongreen'
      );

      document.body.classList.add(
        'theme-' + themeSelector.value
      );
    });
    
    resetBtn.addEventListener('click', function() {
      resetTest();
    });
    
    newCardsBtn.addEventListener('click', function() {
      resetAll();
      notesInput.focus();
    });
    
    exitTestBtn.addEventListener('click', function() {
      exitTestMode();
    });

    window.addEventListener('keydown', (e) => {
      if (!tested || flashcards.length === 0) return;
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const card = flashcards[currentIndex];

      if (card.isTrueFalse) {
        if (e.key === '1') {
          const scoreVal = (true === card.expectedBool) ? 3 : 0;
          handleResponse(scoreVal);
        } else if (e.key === '2') {
          const scoreVal = (false === card.expectedBool) ? 3 : 0;
          handleResponse(scoreVal);
        }
      } else {
        if (e.key === '1') {
          handleResponse(0);
        } else if (e.key === '2') {
          handleResponse(1);
        } else if (e.key === '3') {
          handleResponse(2);
        } else if (e.key === '4') {
          handleResponse(3);
        }
      }
    });

    loadCards();
  })();
</script>
</body>
